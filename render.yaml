services:
  - type: web
    name: m1-ism-micmac-survey
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/m1-submissions/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: M1_SUBMISSIONS_FILE
        value: /var/data/m1-submissions.ndjson
      - key: M1_ADMIN_USER
        sync: false
      - key: M1_ADMIN_PASSWORD
        sync: false
    disk:
      name: m1-submissions
      mountPath: /var/data
      sizeGB: 1
